services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foodflow
      POSTGRES_USER: foodflow
      POSTGRES_PASSWORD: foodflow
    volumes:
      - foodflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodflow -d foodflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ./server
    environment:
      DATABASE_URL: postgresql://foodflow:foodflow@db:5432/foodflow?schema=public
      DIRECT_URL: postgresql://foodflow:foodflow@db:5432/foodflow?schema=public
      JWT_ACCESS_SECRET: foodflow-local-development-secret-key-change-before-production
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: development
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run dev"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      API_INTERNAL_URL: http://server:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

volumes:
  foodflow-data:
